pipeline:
  name: go_client_ci
  identifier: go_client_ci
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubrunnersci
        repoName: go-client
        build: <+input>
        sparseCheckout: []
        depth: 0
  stages:
    - stage:
        name: CI
        identifier: CI
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  identifier: run_tests
                  name: Run Tests
                  type: Run
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.18
                    shell: Bash
                    # Tests in splitio/client/ hardcode localhost:6379, mirroring the GHA
                    # `services: redis` behavior. On Harness Cloud a Background step runs as
                    # a separate container (unreachable at localhost), so we start redis-server
                    # inside this container instead — same technique as split_synchronizer_ci.
                    command: |-
                      apt-get update -qq && apt-get install -y -qq --no-install-recommends redis-server
                      redis-server --daemonize yes
                      for i in $(seq 1 30); do
                        redis-cli ping 2>/dev/null | grep -q PONG && { echo "Redis is up"; break; }
                        echo "Waiting for Redis... ($i/30)"; sleep 1
                      done

                      go mod tidy
                      go test -coverprofile=coverage.out -count=1 -race ./...
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage.out"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/*_test.go,**/vendor/**"
